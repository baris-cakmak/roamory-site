<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join my Roamory Party</title>
<meta name="description" content="You're invited to a Roamory Party: compare travel years with friends. Only totals are shared, never photos or places.">
<meta property="og:title" content="Join my Roamory Party">
<meta property="og:description" content="Compare travel years with friends and see who wins the awards.">
<style>
body{font-family:-apple-system,system-ui,sans-serif;max-width:520px;margin:0 auto;padding:32px 16px;line-height:1.55;text-align:center;background:#D7F75B;color:#0E1525}
h1{font-size:34px;line-height:1.1;margin:8px 0}
.code{font-size:40px;font-weight:800;letter-spacing:6px;margin:16px 0;padding:12px;border-radius:16px;background:#0E1525;color:#D7F75B}
a.btn{display:block;margin:12px 0;padding:14px 20px;border-radius:999px;background:#0E1525;color:#F4F1EA;text-decoration:none;font-weight:700}
a.alt{background:transparent;color:#0E1525;border:2px solid #0E1525}
small{display:block;margin-top:20px;opacity:.75}
</style>
</head>
<body>
<p><strong>ROAMORY PARTY</strong></p>
<h1 id="t">You're invited</h1>
<div class="code" id="c" hidden></div>
<a class="btn" id="open" href="roamory://party">Open in Roamory</a>
<a class="btn alt" id="store" href="https://apps.apple.com/app/id6822888259?ct=party_invite&amp;mt=8">Get Roamory on the App Store</a>
<p id="how">No app yet? Install Roamory, open the Crew tab and enter the code.</p>
<small>Only totals are shared in a party (cities, cat photos, latest photo hour). Never photos or places. <a href="../privacy.html">Privacy</a></small>
<script>
var q = new URLSearchParams(location.search).get("code") || "";
var code = q.toUpperCase().replace(/[^A-Z0-9]/g, "");
if (code.length >= 4 && code.length <= 12) {
  var app = "roamory://party/" + code;
  document.getElementById("t").textContent = "Join my party";
  var c = document.getElementById("c"); c.textContent = code; c.hidden = false;
  document.getElementById("open").href = app;
  location.href = app;
}
</script>
</body>
</html>
